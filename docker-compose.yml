# Local demo stack. Production uses an HTTPS edge and the documented production settings.
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    depends_on: [backend]
    networks: [aegis-net]
    security_opt: [no-new-privileges:true]
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://aegis:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/aegis_firewall
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
      API_KEY: ${API_KEY:?Set a unique API_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-admin123}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080","http://127.0.0.1:8080"]}
      REQUIRE_ML_MODELS: ${REQUIRE_ML_MODELS:-false}
      ENABLE_API_AUTH: "true"
      ENABLE_RATE_LIMITING: "true"
      OUTPUT_SECURITY_MODE: FULL_BUFFER
      WOLF_DEFENDER_MODEL_PATH: /app/models/wolf-defender
      DEBERTA_MODEL_PATH: /app/models/deberta-injection
      LAYA_MODEL_PATH: /app/models/laya
      LIGHTGBM_MODEL_PATH: /app/models/lightgbm/model.txt
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      UPSTREAM_ALLOWED_ORIGINS: ${UPSTREAM_ALLOWED_ORIGINS:-[]}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: [./backend/models:/app/models:ro]
    networks: [aegis-net]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1g
    pids_limit: 128
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/ready]
      interval: 30s
      timeout: 10s
      retries: 3
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegis_firewall
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U aegis -d aegis_firewall]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [aegis-net]
    security_opt: [no-new-privileges:true]
  redis:
    image: redis:7-alpine
    command: [redis-server, --requirepass, "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", --appendonly, "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [aegis-net]
    security_opt: [no-new-privileges:true]
  nginx:
    image: nginx:alpine
    ports: [127.0.0.1:8080:80]
    volumes: [./docker/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on: [frontend, backend]
    networks: [aegis-net]
    security_opt: [no-new-privileges:true]
volumes:
  postgres_data:
  redis_data:
networks:
  aegis-net:
    driver: bridge
